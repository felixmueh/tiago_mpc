# A uv project: `uv sync` creates this checkout's environment (.venv; .venv-container in
# the container, through UV_PROJECT_ENVIRONMENT) from uv.lock, with tiago_mpc installed
# editable. README.md has the setup.
[project]
name = "tiago-mpc"
version = "0.1.0"
requires-python = "==3.10.*"  # ROS 2 Humble's rclpy is 3.10; GATO's module key includes the Python ABI
dependencies = [
    "gato-mpc==0.1.7",         # pins grid-rbd==0.6.0 itself (0.6.0 in uv.lock)
    "grid-rbd==0.6.0",         # direct dependency so this experiment's local armature source is selected
    "pin==3.9.0",
    "cmeel-urdfdom==4.0.1",    # Pinocchio 3.9 wheels link urdfdom 4 / tinyxml2 10; unconstrained latest breaks import
    "cmeel-tinyxml2==10.0.0",
    "matplotlib==3.10.9",
    "cmake==3.31.10",          # GATO compiles with the environment's cmake (mpc.py puts it first on PATH)
    "typing-extensions==4.16.0",  # dynamics.py: assert_never (typing has it from 3.11)
]

[dependency-groups]
dev = ["pytest==9.1.1", "mypy==2.4.0"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tiago_mpc"
module-root = ""               # flat layout: tiago_mpc/ at the checkout's root

[tool.uv]
environments = ["sys_platform == 'linux'"]  # grid-rbd ships Linux wheels only

# A local GATO checkout instead of PyPI, on a branch or worktree only (README.md, "A local
# GATO fork"): uncomment, point path at the checkout, then `uv lock` and `uv sync`.
# [tool.uv.sources]
# gato-mpc = { path = "../GATO", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "tiago_mpc/record.py"]  # record.py: its docstring's example (conftest.py)
addopts = "--doctest-modules"
doctest_optionflags = "ELLIPSIS"

# mypy over the core and experiments/common.py: python -m mypy (tests/test_types.py runs it).
# The other experiments stay unchecked.
[tool.mypy]
files = ["tiago_mpc", "experiments/common.py", "tests/test_types.py"]
python_version = "3.10"
explicit_package_bases = true  # experiments/ has no __init__.py; modules are named from the checkout root
mypy_path = "tests"  # test_types.py imports the sibling test modules by their pytest names
warn_unreachable = true  # also catches an attribute typed None by its first assignment

[[tool.mypy.overrides]]  # not checked: the safety worker (a rewrite is pending) and the experiments
module = ["tiago_mpc.safety", "experiments.*"]
ignore_errors = true

[[tool.mypy.overrides]]  # except the shared experiment code, which is checked (later sections win)
module = ["experiments.common"]
ignore_errors = false

[[tool.mypy.overrides]]  # untyped: GATO, Pinocchio, Coal, SciPy, trimesh and ROS 2
module = ["gato.*", "pinocchio.*", "coal.*", "scipy.*", "trimesh.*", "rclpy.*", "builtin_interfaces.*", "rcl_interfaces.*",
          "controller_manager_msgs.*", "sensor_msgs.*", "std_msgs.*", "sea_state_msgs.*"]
ignore_missing_imports = true

# TODO: Move to upstream once they support armature.
# Local armature support and per-SQP collision-row caching; see README.md.
[tool.uv.sources]
gato-mpc = { path = "_expr_data/jetson-deps/GATO", editable = true }
grid-rbd = { path = "_expr_data/jetson-deps/GRiD" }  # wheel build stages GRiD's validated peer/resources bundle
